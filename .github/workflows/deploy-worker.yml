name: Deploy Audio Worker

# DORMANT: the automatic "push to main" trigger is disabled.
#
# This workflow deploys the Fly.io audio worker (tingle-tracker-audio-worker).
# The worker is being scaled to zero while the app is parked, so an automatic
# redeploy would quietly bring a machine back up. Manual dispatch only.
#
# To re-arm, restore the push trigger:
#   on:
#     push:
#       branches: [main]
#       paths: ['worker/**']
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure git author
        run: |
          git config user.email "paul.t.boye@gmail.com"
          git config user.name "Paul Boye"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: worker
        run: flyctl deploy --remote-only
