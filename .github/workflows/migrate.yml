name: Database Migrations

# DORMANT: the automatic "push to main" trigger is disabled.
#
# This workflow applies migrations straight to the production Supabase database
# using SUPABASE_DB_URL. While the app is parked nobody should be able to alter
# the production schema by merging a branch, so it now only runs when a human
# starts it deliberately from the Actions tab.
#
# To re-arm, restore the push trigger:
#   on:
#     push:
#       branches: [main]
#       paths: ['supabase/migrations/**', 'supabase/seed.sql']
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations via Shared Pooler (IPv4 compatible)
        # Uses the Shared Pooler connection string (port 5432, session mode) which is
        # IPv4 compatible — the direct host (db.*.supabase.co:5432) requires IPv6 / IPv4 add-on.
        # SUPABASE_DB_URL format: postgresql://postgres.PROJECT_REF:PASSWORD@REGION.pooler.supabase.com:5432/postgres
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
