# fly.toml app configuration file generated for tingle-tracker-audio-worker on 2026-04-22T03:03:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tingle-tracker-audio-worker'
primary_region = 'ewr'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
