# fly.toml app configuration file generated for tingle-tracker-audio-worker on 2026-04-22T16:03:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tingle-tracker-audio-worker'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '120s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
